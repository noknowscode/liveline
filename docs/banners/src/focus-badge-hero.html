<!doctype html>
<html><head><meta charset="utf-8"><title>focus-badge-hero</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* focus-badge at 1920 x 1080: the same DPR 6 macro (Dark, seed 2026, frame 550), shown at up to 4.3 CSS px per app px
     (the hero renders at 1x: 4.3 device px, under the capture's 6). */
  .stage { background:
      radial-gradient(34% 46% at 76% 28%, rgba(120,220,119,.16) 0%, rgba(120,220,119,0) 70%),
      radial-gradient(80% 90% at 70% 40%, #262824 0%, #1A1C19 72%); }
  .rules { --rc: rgba(66,73,64,.55); --rs: 72px; --ry: 16px; --rm: radial-gradient(55% 70% at 22% 55%, #000 0%, rgba(0,0,0,.35) 55%, transparent 100%); }
  .scene { position: absolute; left: 470px; top: 36px; width: 1290px; height: 1118px; perspective: 2300px; }
  .plane { position: absolute; inset: 0; transform-origin: 100% 0%; transform: rotateY(-12deg) rotateX(7deg); }
  .plane img { width: 100%; height: 100%; }
  .plane { -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 30%), linear-gradient(180deg, #000 58%, transparent 92%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
</style></head>
<body><div class="stage grain on-night">
  <div class="rules"></div>
  <div class="scene"><div class="plane"><img src="cap/dark-macro@6x.png"></div></div>
</div></body></html>
